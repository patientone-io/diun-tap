services:
  diun-tap:
    image: ghcr.io/patientone-io/diun-tap:latest
    # build: . # Uncomment to build locally from source
    container_name: diun-tap
    restart: unless-stopped
    labels:
      - "diun.enable=false"
    ports:
      - "${WEBHOOK_PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount your host directory containing docker compose stacks (1:1 mount):
      - ${DOCKER_STACKS_DIR:-/srv/docker}:${DOCKER_STACKS_DIR:-/srv/docker}
      # Optional: Custom mappings file (YAML or JSON)
      # - ./mappings.yaml:/config/mappings.yaml:ro
      # Optional: SSH key for remote multi-node setups
      # - ~/.ssh:/root/.ssh:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DOCKER_STACKS_DIR=${DOCKER_STACKS_DIR:-/srv/docker}

  # ----------------------------------------------------------------------------
  # Optional: Bundled DIUN (Docker Image Update Notifier)
  # Uncomment this block if you don't already have DIUN running.
